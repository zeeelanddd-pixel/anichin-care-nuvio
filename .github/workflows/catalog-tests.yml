name: Catalog addon tests

on:
  push:
    paths:
      - "addon/**"
      - ".github/workflows/catalog-tests.yml"
  pull_request:
    paths:
      - "addon/**"
      - ".github/workflows/catalog-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: addon
